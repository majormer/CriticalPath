[CommonSettings]
ModulesToPreload=CriticalPath
SourcePath=Mods/GameFeatures/CriticalPath/Content/Localization/CriticalPath
DestinationPath=Mods/GameFeatures/CriticalPath/Content/Localization/CriticalPath
ManifestName=CriticalPath.manifest
ArchiveName=CriticalPath.archive
NativeCulture=en
CulturesToGenerate=en
